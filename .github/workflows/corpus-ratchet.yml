name: corpus-ratchet
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  corpus:
    name: corpus-ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: node test/runner.mjs --report corpus-outcomes.jsonl
      - name: Accepted passes cannot be removed or rewritten
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/check_ratchet_change.mjs "$BASE_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-outcomes
          path: corpus-outcomes.jsonl
